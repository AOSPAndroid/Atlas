<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas Desktop</title>
    <link rel="stylesheet" href="/assets/desktop.css?v=3" />
    <script src="/assets/shared-ui.js"></script>
    <script defer src="/assets/desktop.js?v=3"></script>
  <link rel="stylesheet" href="/assets/design-system.css" />
    <script defer src="/assets/edge-controls.js"></script>
  </head>
  <body class="atlas-desktop">
    <header class="desktop-menu">
      <button id="home" title="Show desktop" aria-label="Show desktop">
        <img src="/assets/barclays-eagle.svg" alt="" /><b>Atlas</b></button
      ><span id="activeApp">Desktop</span
      ><button
        id="windowMenu"
        aria-expanded="false"
        aria-controls="desktopSettings"
      >
        Window
      </button>
      <div class="menu-spacer"></div>
      <span id="desktopMode">Desktop mode</span
      ><button id="search" title="Search in the active app">
        ⌕ <span>Search</span></button
      ><time id="clock"></time>
    </header>
    <main id="desktopArea" aria-label="Atlas desktop">
      <div class="desktop-welcome">
        <img class="desktop-wallpaper-logo" src="/assets/barclays-eagle.svg" alt="Barclays" />
        <h1>Atlas</h1>
      </div>
      <div id="windows"></div>
      <div id="dragShield" hidden></div>
    </main>
    <aside id="desktopSettings" hidden aria-label="Desktop settings">
      <h2>Settings</h2>
      <label class="desktop-switch"
        ><span
          ><strong>Window multitasking</strong
          ><small>Move and resize multiple apps</small></span
        ><input id="multitask" type="checkbox" role="switch" checked
      /></label>
      <p id="modeHint">Drag a title bar. Double-click to maximize.</p>
      <label class="desktop-switch"
        ><span>Animations</span
        ><input id="desktopMotion" type="checkbox" role="switch" checked
      /></label>
      <hr />
      <button id="resetWindows">Reset window positions</button
      ><button id="showDesktop">Minimize all windows</button>
      <p class="desktop-footnote">
        Atlas Desktop is a browser workspace.<br />Your apps and permissions
        stay the same.
      </p>
    </aside>
    <nav id="dock" aria-label="Application dock"></nav>
    <div id="desktopStatus" role="status" aria-live="polite"></div>
  </body>
</html>
